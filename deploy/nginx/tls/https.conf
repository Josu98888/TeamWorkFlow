# HTTPS server block. NOT enabled by default: deploy/docker-compose.tls.yml mounts this file as
# /etc/nginx/conf.d/default.conf. The certificate must exist first (deploy/README.md, "Enable TLS").
# The certificate is issued with `--cert-name teamworkflow`, so these paths do not depend on the domain.

server {
  listen 80 default_server;
  server_name _;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  # The container healthcheck probes http://127.0.0.1/nginx-health; answer it here instead of
  # redirecting to https://127.0.0.1, which fails the certificate name check.
  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name _;

  ssl_certificate     /etc/letsencrypt/live/teamworkflow/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/teamworkflow/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000" always;

  include /etc/nginx/snippets/locations.conf;
}

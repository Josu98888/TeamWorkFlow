# Default server: plain HTTP on port 80 (no domain yet).
# TLS: deploy/docker-compose.tls.yml mounts nginx/tls/https.conf over this file (see deploy/README.md).

server {
  listen 80 default_server;
  server_name _;

  # Let's Encrypt HTTP-01 challenge (certbot webroot, shared volume).
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  include /etc/nginx/snippets/locations.conf;
}

# Application routing, included by the HTTP and the HTTPS server blocks.
# Longest prefix first is enforced by nginx itself; `^~` keeps regex locations out of the way.

set $core_upstream core:3000;
set $telemetry_upstream telemetry:3003;
set $frontend_upstream frontend:3000;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.amazonaws.com https://*.supabase.co; font-src 'self' data:; connect-src 'self' ws: wss: https://*.amazonaws.com https://*.supabase.co; media-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

# Liveness of nginx itself (used by the compose healthcheck).
location = /nginx-health {
  access_log off;
  default_type text/plain;
  return 200 "ok\n";
}

# 1. Telemetry HTTP API
location ^~ /api/v1/telemetry/ {
  limit_req zone=api_general burst=30 nodelay;
  include /etc/nginx/snippets/proxy-headers.conf;
  proxy_pass http://$telemetry_upstream;
}

# 2. Torre de Control WebSocket (Socket.IO, path /ws)
location = /ws {
  include /etc/nginx/snippets/proxy-headers.conf;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 86400s;
  proxy_send_timeout 86400s;
  proxy_pass http://$telemetry_upstream;
}

location ^~ /ws/ {
  include /etc/nginx/snippets/proxy-headers.conf;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 86400s;
  proxy_send_timeout 86400s;
  proxy_pass http://$telemetry_upstream;
}

# 3. Core public auth endpoints exposed to brute force
location ~ ^/api/v1/auth/(login|register|refresh|invitations/accept|password-reset/confirm)$ {
  limit_req zone=api_auth burst=5 nodelay;
  include /etc/nginx/snippets/proxy-headers.conf;
  proxy_pass http://$core_upstream;
}

# 4. Core HTTP API (every other /api/v1 route)
location /api/v1/ {
  limit_req zone=api_general burst=30 nodelay;
  include /etc/nginx/snippets/proxy-headers.conf;
  proxy_pass http://$core_upstream;
}

# 5. Frontend (Next.js standalone server)
location / {
  include /etc/nginx/snippets/proxy-headers.conf;
  proxy_pass http://$frontend_upstream;
}

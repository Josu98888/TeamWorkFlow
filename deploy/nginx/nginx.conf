worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  # Same-origin API: uploads go straight to S3 with presigned URLs, so request bodies stay small.
  client_max_body_size 5m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

  # Docker's embedded DNS. Upstreams are variables (see snippets/locations.conf) so nginx re-resolves
  # the service names at request time and also starts when an upstream is not up yet.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Per-IP rate limiting zones: strict for public auth endpoints, general for the rest of the API.
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
  limit_req_status 429;

  # WebSocket upgrade only when the client asks for it.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  include /etc/nginx/conf.d/*.conf;
}

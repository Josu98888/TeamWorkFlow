#  docker compose up --build
#  Variables come from backend/.env (see backend/.env.example).

services:
  nats-server:
    image: nats:latest
    # JetStream on (-js) with its store on a volume (backend/STEPS.md S1.2, S2.1)
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=teamworkflow
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      - AUTH_DB_PASSWORD=${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in backend/.env}
      - ORGANIZATION_DB_PASSWORD=${ORGANIZATION_DB_PASSWORD:?set ORGANIZATION_DB_PASSWORD in backend/.env}
      - ATTENDANCE_DB_PASSWORD=${ATTENDANCE_DB_PASSWORD:?set ATTENDANCE_DB_PASSWORD in backend/.env}
      - TASKS_DB_PASSWORD=${TASKS_DB_PASSWORD:?set TASKS_DB_PASSWORD in backend/.env}
      - NOTIFICATIONS_DB_PASSWORD=${NOTIFICATIONS_DB_PASSWORD:?set NOTIFICATIONS_DB_PASSWORD in backend/.env}
      - BILLING_DB_PASSWORD=${BILLING_DB_PASSWORD:?set BILLING_DB_PASSWORD in backend/.env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # One schema + one role per core module and for telemetry (backend/STEPS.md S1.1, S2.2)
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teamworkflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  core:
    build:
      context: ./core
      dockerfile: dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./core/src:/usr/src/app/src
    environment:
      - PORT=3000
      - NATS_SERVER=nats://nats-server:4222
      - AUTH_DATABASE_URL=postgresql://auth_svc:${AUTH_DB_PASSWORD}@postgres:5432/teamworkflow?schema=auth
      - ORGANIZATION_DATABASE_URL=postgresql://organization_svc:${ORGANIZATION_DB_PASSWORD}@postgres:5432/teamworkflow?schema=organization
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in backend/.env}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-15m}
      - REFRESH_TOKEN_TTL=${REFRESH_TOKEN_TTL:-7d}
      # Bind mounts on Windows do not emit file events; polling makes --watch reload work
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      nats-server:
        condition: service_started
      postgres:
        condition: service_healthy

  telemetry:
    build:
      context: ./telemetry
      dockerfile: Dockerfile
      target: builder
    ports:
      - "3003:3003"
    volumes:
      - ./telemetry/src:/usr/src/app/src
    environment:
      - PORT=3003
      - NATS_SERVER=nats://nats-server:4222
      - ATTENDANCE_DATABASE_URL=postgresql://attendance_svc:${ATTENDANCE_DB_PASSWORD}@postgres:5432/teamworkflow?schema=attendance
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost:3000}
      - CHOKIDAR_USEPOLLING=true
    command: ["pnpm", "run", "start:dev"]
    depends_on:
      nats-server:
        condition: service_started
      postgres:
        condition: service_healthy

  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - core
      - telemetry

volumes:
  nats-data:
  postgres-data:

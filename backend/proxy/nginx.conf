events {
  worker_connections 1024;
}

http {
  # Docker's embedded DNS. Upstreams are variables so nginx re-resolves the
  # service names at request time: a restarted container can get a new IP, and
  # a static `upstream` block would keep the old one and answer 502.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Per-IP rate limiting zones: strict for public auth endpoints, general for the rest of the API.
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
  limit_req_status 429;

  server {
    listen 80;

    set $core_upstream core:3000;
    set $telemetry_upstream telemetry:3003;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.amazonaws.com https://*.supabase.co; font-src 'self' data:; connect-src 'self' ws: wss: https://*.amazonaws.com https://*.supabase.co; media-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # 1. Telemetry HTTP API (longest prefix first)
    location ^~ /api/v1/telemetry/ {
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://$telemetry_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Telemetry Torre de Control WebSocket (/ws)
    location /ws/ {
      proxy_pass http://$telemetry_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # 3. Core public auth endpoints exposed to brute force
    location ~ ^/api/v1/auth/(login|register|refresh|invitations/accept|password-reset/confirm)$ {
      limit_req zone=api_auth burst=5 nodelay;
      proxy_pass http://$core_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Core HTTP API (all other /api/v1/ endpoints)
    location /api/v1/ {
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://$core_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

events {
  worker_connections 1024;
}

http {
  # Docker's embedded DNS. Upstreams are variables so nginx re-resolves the
  # service names at request time: a restarted container can get a new IP, and
  # a static `upstream` block would keep the old one and answer 502.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;

    set $core_upstream core:3000;
    set $telemetry_upstream telemetry:3003;

    # 1. Telemetry HTTP API (longest prefix first)
    location /api/v1/telemetry/ {
      proxy_pass http://$telemetry_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Telemetry Torre de Control WebSocket (/ws)
    location /ws/ {
      proxy_pass http://$telemetry_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # 3. Core HTTP API (all other /api/v1/ endpoints)
    location /api/v1/ {
      proxy_pass http://$core_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

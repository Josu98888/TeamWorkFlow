events {
  worker_connections 1024;
}

http {
  upstream core_upstream {
    server core:3000;
  }

  upstream telemetry_upstream {
    server telemetry:3003;
  }

  server {
    listen 80;

    # 1. Telemetry HTTP API (longest prefix first)
    location /api/v1/telemetry/ {
      proxy_pass http://telemetry_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Telemetry Torre de Control WebSocket (/ws)
    location /ws/ {
      proxy_pass http://telemetry_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # 3. Core HTTP API (all other /api/v1/ endpoints)
    location /api/v1/ {
      proxy_pass http://core_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

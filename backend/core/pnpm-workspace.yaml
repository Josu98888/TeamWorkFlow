# Slow registry downloads (e.g. two Docker builds in parallel) must retry instead of aborting the install
fetchTimeout: 300000
fetchRetries: 5

allowBuilds:
  '@firebase/util': false
  '@parcel/watcher': false
  '@prisma/engines': true
  argon2: false
  prisma: true
  protobufjs: false
  unrs-resolver: false

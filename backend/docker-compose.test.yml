# E2E infrastructure (backend/STEPS.md S1.4, S2.5). Isolated from the dev stack:
# own project name, other ports, no persistent volumes (every run starts clean).
#
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down
#
# Passwords below are throwaway test-only values for an in-memory database.

name: teamworkflow-test

services:
  nats-test:
    image: nats:latest
    command: ["-js", "-m", "8222"]
    ports:
      - "4223:4222"
      - "8223:8222"

  postgres-test:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=teamworkflow
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=test
      - AUTH_DB_PASSWORD=test
      - ORGANIZATION_DB_PASSWORD=test
      - ATTENDANCE_DB_PASSWORD=test
      - TASKS_DB_PASSWORD=test
      - NOTIFICATIONS_DB_PASSWORD=test
      - BILLING_DB_PASSWORD=test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      # Same init script as the dev database: same schemas and roles
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teamworkflow"]
      interval: 2s
      timeout: 5s
      retries: 15

  seaweedfs-test:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-s3", "-s3.port=8333"]
    environment:
      - AWS_ACCESS_KEY_ID=test-s3-access
      - AWS_SECRET_ACCESS_KEY=test-s3-secret-key
    ports:
      - "9002:8333"
    tmpfs:
      - /data

  seaweedfs-test-init:
    image: chrislusf/seaweedfs:latest
    depends_on:
      - seaweedfs-test
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        for i in $$(seq 1 60); do
          code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT --aws-sigv4 'aws:amz:us-east-1:s3' --user test-s3-access:test-s3-secret-key http://seaweedfs-test:8333/teamworkflow-tasks)
          case "$$code" in 200|409) echo "bucket ready ($$code)"; exit 0;; esac
          sleep 2
        done
        echo "could not create bucket" >&2
        exit 1

name: Publish images

# Builds the five production images and pushes them to GHCR as
# ghcr.io/<owner>/teamworkflow-<app>, the names deploy/docker-compose.prod.yml pulls.
# Triggers: pushing a version tag `v*` (from any branch; the run uses the workflow
# file of the tagged commit) or a manual run (needs the file on the default branch).
# Each image gets two tags: the version (git tag on a tag push; otherwise the `tag`
# input, default the short commit SHA) and `latest` (the compose default for IMAGE_TAG).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (defaults to the short commit SHA). latest is always pushed too.'
        required: false
        type: string

concurrency:
  group: publish-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: teamworkflow-core
            context: backend/core
            file: backend/core/Dockerfile.prod
            target: runner
          - image: teamworkflow-core-migrate
            context: backend/core
            file: backend/core/Dockerfile.prod
            target: migrate
          - image: teamworkflow-telemetry
            context: backend/telemetry
            file: backend/telemetry/Dockerfile
            target: runner
          - image: teamworkflow-telemetry-migrate
            context: backend/telemetry
            file: backend/telemetry/Dockerfile
            target: migrate
          # Single-origin nginx setup: NEXT_PUBLIC_WS_URL stays empty (Socket.IO uses the
          # page origin, nginx serves /ws) and BACKEND_URL is the internal nginx service,
          # so the image carries no domain and is reusable on any host.
          - image: teamworkflow-frontend
            context: frontend
            file: frontend/Dockerfile.prod
            target: runner
            build_args: |
              NEXT_PUBLIC_USE_MOCKS=false
              NEXT_PUBLIC_WS_URL=
              BACKEND_URL=http://nginx
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the image name and tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${INPUT_TAG:-${GITHUB_SHA::7}}"
          fi
          echo "name=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: |
            ${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

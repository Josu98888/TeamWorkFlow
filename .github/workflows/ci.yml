name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.5.2'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      telemetry: ${{ steps.filter.outputs.telemetry }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      # workflow_dispatch has no diff: the jobs below run unconditionally then.
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            core:
              - 'backend/core/**'
              - 'backend/docker-compose.test.yml'
              - 'backend/postgres/**'
              - '.github/workflows/ci.yml'
            telemetry:
              - 'backend/telemetry/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'backend/core/Dockerfile.prod'
              - 'backend/core/.dockerignore'
              - 'backend/core/package.json'
              - 'backend/core/pnpm-lock.yaml'
              - 'backend/core/pnpm-workspace.yaml'
              - 'backend/core/prisma.*.config.ts'
              - 'backend/core/src/*/prisma/**'
              - 'backend/telemetry/Dockerfile'
              - 'backend/telemetry/.dockerignore'
              - 'backend/telemetry/package.json'
              - 'backend/telemetry/pnpm-lock.yaml'
              - 'backend/telemetry/pnpm-workspace.yaml'
              - 'backend/telemetry/prisma.*.config.ts'
              - 'backend/telemetry/src/prisma/**'
              - 'frontend/Dockerfile.prod'
              - 'frontend/.dockerignore'
              - 'frontend/next.config.*'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/pnpm-workspace.yaml'
              - 'backend/docker-compose.test.yml'
              - 'backend/postgres/**'
              - 'deploy/**'
              - '.github/workflows/ci.yml'

  core:
    name: Core (lint, test, build)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/core
    # Harmless non-secret values: the joi schema validates them when specs
    # import src/config/envs.ts. Nothing connects to Postgres or NATS.
    env:
      PORT: '3000'
      NATS_SERVER: nats://localhost:4222
      AUTH_DATABASE_URL: postgresql://ci:ci@localhost:5432/teamworkflow?schema=auth
      ORGANIZATION_DATABASE_URL: postgresql://ci:ci@localhost:5432/teamworkflow?schema=organization
      BILLING_DATABASE_URL: postgresql://ci:ci@localhost:5432/teamworkflow?schema=billing
      TASKS_DATABASE_URL: postgresql://ci:ci@localhost:5432/teamworkflow?schema=tasks
      NOTIFICATIONS_DATABASE_URL: postgresql://ci:ci@localhost:5432/teamworkflow?schema=notifications
      JWT_SECRET: ci-only-jwt-secret-not-a-real-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/core/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma clients
        run: |
          pnpm prisma:auth:generate
          pnpm prisma:organization:generate
          pnpm prisma:billing:generate
          pnpm prisma:tasks:generate
          pnpm prisma:notifications:generate
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  core-e2e:
    name: Core (e2e)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/core
    # No env here on purpose: test/support/test-env.ts pins every URL, port and
    # throwaway credential of the isolated stack (Postgres 5433, NATS 4223,
    # SeaweedFS S3 9002) and refuses to run against anything else.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/core/pnpm-lock.yaml
      # The same stack developers use locally (throwaway values, tmpfs). It
      # mounts backend/postgres/init, which creates the schemas and roles, and
      # NATS needs -js, which service containers cannot pass; hence compose.
      - name: Start the e2e stack
        run: docker compose -f ../docker-compose.test.yml up -d --wait postgres-test nats-test seaweedfs-test
      - name: Create the S3 bucket
        run: |
          docker compose -f ../docker-compose.test.yml up -d seaweedfs-test-init
          init_id="$(docker compose -f ../docker-compose.test.yml ps -aq seaweedfs-test-init)"
          code="$(docker wait "$init_id")"
          docker logs "$init_id"
          test "$code" = "0"
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma clients
        run: |
          pnpm prisma:auth:generate
          pnpm prisma:organization:generate
          pnpm prisma:billing:generate
          pnpm prisma:tasks:generate
          pnpm prisma:notifications:generate
      # globalSetup runs `prisma migrate deploy` for the five modules.
      - run: pnpm test:e2e
      - name: Stack logs
        if: failure()
        run: docker compose -f ../docker-compose.test.yml logs --no-color --tail=200
      - name: Stop the e2e stack
        if: always()
        run: docker compose -f ../docker-compose.test.yml down -v

  telemetry:
    name: Telemetry (lint, test, build)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.telemetry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/telemetry
    env:
      PORT: '3003'
      NATS_SERVER: nats://localhost:4222
      ATTENDANCE_DATABASE_URL: postgresql://ci:ci@localhost:5432/teamworkflow?schema=attendance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/telemetry/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:attendance:generate
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build

  frontend:
    name: Frontend (lint, tsc, build)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    # The build needs no secrets: every variable has a default (mock mode on).
    env:
      NEXT_PUBLIC_USE_MOCKS: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: npx tsc --noEmit
      - run: pnpm build

  docker:
    name: Docker images (build, migrate)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Compose project `teamworkflow-test` names its default network this way.
      COMPOSE_NETWORK: teamworkflow-test_default
      # Throwaway credentials of the tmpfs test database (backend/postgres/init
      # creates one `<module>_svc` role per schema with password `test`).
      PG_HOST: postgres-test:5432
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Production stack config (deploy/): cheap, offline, runs before the image builds.
      - name: Validate the production compose files
        working-directory: deploy
        run: |
          cp compose.env.example .env
          cp env/core.env.example env/core.env
          cp env/telemetry.env.example env/telemetry.env
          docker compose -f docker-compose.prod.yml --profile '*' config -q
          docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml --profile '*' config -q
      - name: Validate the nginx config (HTTP and HTTPS)
        run: |
          # Variable upstreams are resolved at request time, so `nginx -t` needs no other container.
          # The HTTPS block needs certificate files: use a throwaway self-signed pair.
          le="$RUNNER_TEMP/letsencrypt/live/teamworkflow"
          mkdir -p "$le"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=ci" \
            -keyout "$le/privkey.pem" -out "$le/fullchain.pem"
          for conf in conf.d/http.conf tls/https.conf; do
            echo "nginx -t with $conf"
            docker run --rm \
              -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
              -v "$PWD/deploy/nginx/$conf:/etc/nginx/conf.d/default.conf:ro" \
              -v "$PWD/deploy/nginx/snippets:/etc/nginx/snippets:ro" \
              -v "$RUNNER_TEMP/letsencrypt:/etc/letsencrypt:ro" \
              nginx:1.27-alpine nginx -t
          done

      # Nothing is pushed. The GitHub cache keeps the layers between runs.
      # core and telemetry runners are only built: they need NATS, Postgres and
      # the full env to boot, which the e2e jobs already cover.
      - name: Build core (runner)
        uses: docker/build-push-action@v6
        with:
          context: backend/core
          file: backend/core/Dockerfile.prod
          target: runner
          push: false
          cache-from: type=gha,scope=core-runner
          cache-to: type=gha,mode=max,scope=core-runner
      - name: Build core (migrate)
        uses: docker/build-push-action@v6
        with:
          context: backend/core
          file: backend/core/Dockerfile.prod
          target: migrate
          push: false
          load: true
          tags: teamworkflow-core-migrate:ci
          cache-from: type=gha,scope=core-migrate
          cache-to: type=gha,mode=max,scope=core-migrate
      - name: Build telemetry (runner)
        uses: docker/build-push-action@v6
        with:
          context: backend/telemetry
          file: backend/telemetry/Dockerfile
          target: runner
          push: false
          cache-from: type=gha,scope=telemetry-runner
          cache-to: type=gha,mode=max,scope=telemetry-runner
      - name: Build telemetry (migrate)
        uses: docker/build-push-action@v6
        with:
          context: backend/telemetry
          file: backend/telemetry/Dockerfile
          target: migrate
          push: false
          load: true
          tags: teamworkflow-telemetry-migrate:ci
          cache-from: type=gha,scope=telemetry-migrate
          cache-to: type=gha,mode=max,scope=telemetry-migrate
      - name: Build frontend (runner)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          target: runner
          push: false
          load: true
          tags: teamworkflow-frontend:ci
          cache-from: type=gha,scope=frontend-runner
          cache-to: type=gha,mode=max,scope=frontend-runner

      # Run the migrate images against a fresh database that has the per-module
      # schemas and roles (same init script as the e2e stack).
      - name: Start Postgres
        run: docker compose -f backend/docker-compose.test.yml up -d --wait postgres-test
      - name: Run core migrations
        run: |
          docker run --rm --network "$COMPOSE_NETWORK" \
            -e "AUTH_DATABASE_URL=postgresql://auth_svc:test@${PG_HOST}/teamworkflow?schema=auth" \
            -e "ORGANIZATION_DATABASE_URL=postgresql://organization_svc:test@${PG_HOST}/teamworkflow?schema=organization" \
            -e "BILLING_DATABASE_URL=postgresql://billing_svc:test@${PG_HOST}/teamworkflow?schema=billing" \
            -e "TASKS_DATABASE_URL=postgresql://tasks_svc:test@${PG_HOST}/teamworkflow?schema=tasks" \
            -e "NOTIFICATIONS_DATABASE_URL=postgresql://notifications_svc:test@${PG_HOST}/teamworkflow?schema=notifications" \
            teamworkflow-core-migrate:ci
      - name: Run telemetry migrations
        run: |
          docker run --rm --network "$COMPOSE_NETWORK" \
            -e "ATTENDANCE_DATABASE_URL=postgresql://attendance_svc:test@${PG_HOST}/teamworkflow?schema=attendance" \
            teamworkflow-telemetry-migrate:ci

      - name: Smoke test the frontend image
        run: |
          docker run -d --name frontend-smoke -p 3000:3000 teamworkflow-frontend:ci
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)"
            echo "attempt $i: HTTP $code"
            # `/` may redirect (for example to the login page): 2xx and 3xx are fine.
            if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 400 ]; then
              exit 0
            fi
            sleep 2
          done
          echo "frontend did not answer 2xx/3xx" >&2
          exit 1
      - name: Container logs
        if: failure()
        run: |
          docker logs frontend-smoke || true
          docker compose -f backend/docker-compose.test.yml logs --no-color --tail=200 postgres-test || true
      - name: Stop containers
        if: always()
        run: |
          docker rm -f frontend-smoke || true
          docker compose -f backend/docker-compose.test.yml down -v
